name: liquid_glass_tab_bar
description: >-
  An iOS 26 style floating "liquid glass" tab bar for Flutter. The selection
  capsule turns into a real refracting glass droplet while you press, drag or
  switch tabs. Works on iOS and Android (Impeller).
version: 0.1.0-dev.1

repository: https://github.com/KananTaghili/liquid_glass_tab_bar
issue_tracker: https://github.com/KananTaghili/liquid_glass_tab_bar/issues

topics:
  - navigation
  - tab-bar
  - liquid-glass
  - ios
  - glassmorphism

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.4"

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_renderer: ^0.2.0-dev.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Liquid glass tab bar in light and dark mode.
    path: doc/screenshot.png
